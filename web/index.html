<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Concern Compiler</title>
        <style>
            body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 70rem; }
            section { margin-bottom: 1.25rem; }
            label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
            button { padding: 6px 14px; }
            h3 { margin-bottom: 0; }
            table { border-collapse: collapse; margin-top: 0.5rem; }
            th, td { border: 1px solid #ccc; padding: 4px 10px; text-align: left; }
            thead th { background: #f3f3f3; }
            #status { color: #666; margin: 0.75rem 0; }
        </style>
    </head>
    <body>
        <h1>Concern Compiler</h1>
    
        <section>
            <label for="input">1. New concerns (.csv, single tab)</label>
            <input type="file" disabled="true" id="input" accept=".csv,.xlsx,.xls">
        </section>

        <section>
            <button id="compile" disabled>Compile</button>
            <button id="reset_db">Clear Database</button>
            <button id="download" disabled>Download .xlsx</button>
        </section>

        <section>
            <label for="neurons">Daily neuron usage</label>
            <progress id="neurons" max="100" value="0"></progress>
            <span id="neuronsText">0%</span>
        </section>

        <div id="status">Loading WASM…</div>

        <section>
            <label for="progress">Compile progress</label>
            <progress id="progress" max="100" value="0"></progress>
            <span id="progressText">0%</span>
        </section>

        <section>
            <div id="result"></div>
        </section>
    
        <script src="xlsx.full.min.js"></script>
        <script type="module" src="main.js"></script>
    </body>
</html>
